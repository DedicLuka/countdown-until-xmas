
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062d29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A magical, free Christmas countdown with snowfall and festive messages.">
<title>Countdown Until Xmas</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#062d29;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  position:relative;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(ellipse at center,
    #175447,#062d29 75%);
}

.background{
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    url("christmas-background.jpg")
    center center/cover no-repeat;
}

.shade{
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(
    180deg,
    rgba(2,25,23,.2),
    rgba(2,28,25,.28) 55%,
    rgba(2,25,23,.12)
  );
}

.screen{
  width:100%;
  max-width:500px;
  height:100%;
  margin:auto;
  padding:
    max(12px,env(safe-area-inset-top))
    15px
    max(12px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:space-evenly;
  text-align:center;
  position:relative;
  z-index:2;
}

.eyebrow{
  font-size:clamp(8px,1.1dvh,11px);
  letter-spacing:2px;
  color:#ffe0a0;
  font-weight:bold;
}

.tree{
  font-size:clamp(35px,7dvh,65px);
  margin:5px 0;
  filter:drop-shadow(0 0 10px #ffd56a);
}

h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:clamp(29px,5.3dvh,49px);
  line-height:1.05;
  text-shadow:0 3px 12px #000b;
}

h1 span{
  color:#ffe0a0;
  font-style:italic;
  font-size:1.1em;
}

.subtitle{
  margin:7px 0 0;
  font-size:clamp(11px,1.7dvh,15px);
  color:#e5eee9;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
}

.time-box{
  padding:clamp(10px,1.7dvh,17px) 2px;
  border:1px solid #e5f2e9a0;
  border-radius:15px;
  background:rgba(15,65,55,.72);
  backdrop-filter:blur(8px);
  box-shadow:0 4px 12px #0003;
}

.number{
  font-size:clamp(24px,4.7dvh,43px);
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.unit{
  margin-top:4px;
  font-size:clamp(8px,1.1dvh,10px);
  letter-spacing:.6px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:clamp(10px,1.4dvh,13px);
  margin-bottom:7px;
}

.progress-track{
  height:8px;
  border-radius:20px;
  background:#ffffff38;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  border-radius:20px;
  background:linear-gradient(
    90deg,#d6a146,#ffe4a0);
  transition:width .5s;
}

.magic-card{
  padding:clamp(10px,1.6dvh,17px) 8px;
  border-radius:16px;
  border:1px solid #e5f2e988;
  background:rgba(9,54,47,.77);
  backdrop-filter:blur(8px);
}

.magic-title{
  color:#ffe0a0;
  font-family:Georgia,serif;
  font-size:clamp(15px,2.1dvh,20px);
  font-weight:bold;
}

.magic-text{
  margin-top:7px;
  font-size:clamp(11px,1.6dvh,14px);
  color:#edf4ed;
  min-height:18px;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.action-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:38px;
  padding:9px 14px;
  border-radius:30px;
  border:1px solid rgba(255,225,165,.42);
  background:rgba(7,48,41,.64);
  color:#f6e8cb;
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  backdrop-filter:blur(8px);
  box-shadow:0 3px 9px #0002;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.action-button:active{
  background:rgba(30,83,70,.9);
}

.action-icon{
  font-size:15px;
  color:#ffe0a0;
}

.footer{
  color:#ffe0a0;
  font-size:10px;
  letter-spacing:3px;
  font-weight:bold;
  text-shadow:0 2px 7px #0008;
}

.snow{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}

.snowflake{
  position:absolute;
  top:-20px;
  color:white;
  animation:snowfall linear infinite;
}

@keyframes snowfall{
  from{transform:translateY(-30px)}
  to{transform:translateY(110vh)}
}

@media(max-height:650px){
  .tree{font-size:30px}
  h1{font-size:29px}
  .time-box{padding:8px 2px}
  .magic-card{padding:9px 7px}
  .action-button{
    min-height:32px;
    padding:7px 12px;
  }
}

@media(max-height:520px){
  .tree{display:none}
  .subtitle{display:none}
}

@media(max-width:350px){
  .screen{
    padding-left:9px;
    padding-right:9px;
  }
  .countdown{gap:5px}
  .action-button{
    padding:8px 10px;
    font-size:11px;
  }
}

@media(prefers-reduced-motion:reduce){
  .snowflake{display:none}
}
</style>
</head>

<body>

<div class="app">

  <div class="background"></div>
  <div class="shade"></div>
  <div class="snow" id="snow"></div>

  <main class="screen">

    <header>
      <div class="eyebrow">
        THE MOST WONDERFUL TIME OF THE YEAR
      </div>

      <div class="tree">🎄</div>

      <h1>
        Countdown to<br>
        <span>Christmas</span>
      </h1>

      <p class="subtitle">
        The magic begins in...
      </p>
    </header>

    <section class="countdown">

      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="unit">DAYS</div>
      </div>

      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="unit">HOURS</div>
      </div>

      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="unit">MINUTES</div>
      </div>

      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="unit">SECONDS</div>
      </div>

    </section>

    <section class="progress-section">

      <div class="progress-info">
        <span>🎁 Christmas is coming</span>
        <strong id="percentage">0%</strong>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress"></div>
      </div>

    </section>

    <section class="magic-card">

      <div class="magic-title">
        ✨ A little Christmas magic ✨
      </div>

      <div class="magic-text" id="magicMessage">
        Believe in the magic of Christmas!
      </div>

    </section>

    <div class="actions">

      <button
        id="shareButton"
        class="action-button"
        type="button"
      >
        <span class="action-icon">↗</span>
        Share
      </button>

      <a
        id="donateButton"
        class="action-button"
        href="https://ko-fi.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="action-icon">☕</span>
        Buy Santa a coffee
      </a>

    </div>

    <div class="footer">
      ✧ DECEMBER 25 ✧
    </div>

  </main>
</div>

<script>

// DONATION LINK
// Replace with your own Ko-fi profile URL.
// Donations are entirely optional.
// All app features remain 100% free.

const DONATION_URL = "https://ko-fi.com/";

document.getElementById("donateButton").href =
  DONATION_URL;


// COUNTDOWN

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

function pad(n){
  return String(n).padStart(2,"0");
}

function updateCountdown(){

  const now = new Date();

  let christmas = new Date(
    now.getFullYear(),11,25,0,0,0
  );

  if(now >= christmas){
    christmas = new Date(
      now.getFullYear()+1,11,25,0,0,0
    );
  }

  const diff = christmas-now;

  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff/3600000)%24);
  const minutes = Math.floor((diff/60000)%60);
  const seconds = Math.floor((diff/1000)%60);

  daysEl.textContent = days;
  hoursEl.textContent = pad(hours);
  minutesEl.textContent = pad(minutes);
  secondsEl.textContent = pad(seconds);

  const previous = new Date(
    christmas.getFullYear()-1,11,25
  );

  const total = christmas-previous;
  const elapsed = now-previous;

  const progress = Math.max(
    0,Math.min(100,elapsed/total*100)
  );

  document.getElementById("percentage")
    .textContent = progress.toFixed(1)+"%";

  document.getElementById("progress")
    .style.width = progress+"%";
}

updateCountdown();
setInterval(updateCountdown,1000);


// 12 RANDOM CHRISTMAS SLOGANS
// A new slogan is selected on every page load.

const messages = [
  "Believe in the magic of Christmas!",
  "It's the most wonderful time of the year!",
  "Christmas is where memories are made.",
  "Let your heart be light this Christmas.",
  "The magic of Christmas never fades.",
  "All roads lead home for Christmas.",
  "A season of joy, love and wonder.",
  "Every snowflake carries a little magic.",
  "The best gifts come from the heart.",
  "Christmas brings us closer together.",
  "Make a wish upon a Christmas star.",
  "May your Christmas sparkle with joy!"
];

const randomIndex = Math.floor(
  Math.random()*messages.length
);

document.getElementById("magicMessage")
  .textContent = messages[randomIndex];


// SNOW

const snow = document.getElementById("snow");

if(!window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches){

  for(let i=0;i<45;i++){

    const flake = document.createElement("span");
    flake.className = "snowflake";

    flake.textContent =
      Math.random()>.75 ? "❄" : "•";

    flake.style.left =
      Math.random()*100+"%";

    flake.style.fontSize =
      (4+Math.random()*10)+"px";

    flake.style.opacity =
      .2+Math.random()*.6;

    flake.style.animationDuration =
      (8+Math.random()*13)+"s";

    flake.style.animationDelay =
      (-Math.random()*21)+"s";

    snow.appendChild(flake);
  }
}


// SHARE

const shareButton =
  document.getElementById("shareButton");

shareButton.addEventListener(
  "click",
  async () => {

    const message =
      "🎄 Only "+daysEl.textContent+
      " days until Christmas! 🎅";

    try{

      if(navigator.share){

        await navigator.share({
          title:"Countdown Until Xmas",
          text:message,
          url:window.location.href
        });

      }else if(navigator.clipboard){

        await navigator.clipboard.writeText(
          message+" "+window.location.href
        );

        shareButton.textContent = "✓ Copied";

        setTimeout(()=>{
          shareButton.innerHTML =
            '<span class="action-icon">↗</span> Share';
        },2000);

      }else{

        shareButton.textContent =
          "Sharing unavailable";

        setTimeout(()=>{
          shareButton.innerHTML =
            '<span class="action-icon">↗</span> Share';
        },2000);
      }

    }catch(error){
      // User cancelled sharing.
    }
  }
);

</script>

</body>
</html>
